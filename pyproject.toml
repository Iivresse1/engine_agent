[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-agent"
version = "0.1.0"
description = "Project Agent：CLI 项目构建 agent（LangGraph 单图 + 断点协议）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.6"]

[project.scripts]
project-agent = "project_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["replay: 会话回放测试（主接缝 REPL↔主图协议）"]
addopts = "-ra"
