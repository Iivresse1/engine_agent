[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-agent"
version = "0.1.0"
description = "Project Agent：CLI 项目构建 agent（LangGraph 单图 + 断点协议）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3.0",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.6"]

[project.scripts]
project-agent = "project_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"project_agent.tools" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["replay: 会话回放测试（主接缝 REPL↔主图协议）"]
addopts = "-ra"
# 护栏：未知 warning 一律升 error；新噪音必须显式分诊后才能加 ignore
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 窄而机械：真实错误类（F/W/E9）+ 导入排序（I）。风格判断项（UP/SIM/BLE/PT）不进检查
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 回放测试常丢弃 invoke 返回值
"tests/**" = ["F841"]
